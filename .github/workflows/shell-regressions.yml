name: Shell regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bookshelf-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optimizer dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python regressions
        run: python -m unittest discover -s tests -v
      - name: Run Bookshelf handoff regression
        run: bash tests/test-bookshelf-handoff.sh
      - name: Check handoff script syntax
        run: bash -n scripts/bookshelf-custom-script.sh scripts/epub-import-hook.sh scripts/load-env.sh
